name: PR Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  current-head-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "simple-flow[test] @ git+https://github.com/Anthony-s-Study-Hub/simple-flow.git@v0.2.0"
      - name: Run current head tests
        run: python -m pytest
